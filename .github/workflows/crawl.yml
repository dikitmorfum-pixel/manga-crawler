name: Manga Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install aiohttp==3.9.3 aiofiles==23.2.1 asyncpg==0.29.0 beautifulsoup4==4.12.3 lxml==5.1.0

      - name: Rodar crawler
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
                run: python crawler.py
